version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot-build
    command: sh -c "npx prisma db push --schema=src/db/schema.prisma && node dist/index.js"
    working_dir: /app/bot
    env_file:
      - .env
    volumes:
      - bot-data:/app/bot/dev.db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-build
    command: npm start
    working_dir: /app/web
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  bot-data:
